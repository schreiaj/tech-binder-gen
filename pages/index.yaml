name: "Team 1234 — 2025 Engineering Notebook"
logoWordmark: "Toasty" # bold word in header logo lockup
teamLabel: "TEAM 1234 | Brave Little Toasters" # eyebrow text above chapter titles
year: "2025"
logo: assets/images/icon.webp
model: assets/models/Everybot2026.glb
template: default
facing: NW
elevation: UPPER
annotations:
  - label: Beast Mode Drivetrain
    description: Allows rapid repositioning
    position: 10
    target: "01_Chassis_<1>"
  - label: Wicked Fast Intake
    description: Collects fuel quickly
    position: 2
    target: "03_Intake_<1>"
  - label: Three's for Days
    description: Enables reliable scoring
    target: 05_Launcher_<1>
    position: 5

chapters:
  - Chassis:
      sections:
        - Overview:
            id: chassis-overview
            displayedNodes: ["01_Chassis_<1>"]
            facing: NE
            elevation: UPPER
            side: left
            features:
              - |
                **AndyMark AM14U6** is part of the Kit of Parts — well-tested and reliable.
              - |
                **6" rubber treaded wheels** provide good traction with field carpet. The center wheel sits **0.14" lower** than the front and rear wheels (drop center), making it easier to turn on the spot and make small adjustments when picking up and scoring game pieces.
        - Size:
            id: chassis-size
            displayedNodes: ["01_Chassis_<1>"]
            facing: N
            elevation: TOP
            side: right
            features:
              - |
                **"Square" chassis configuration** was chosen to retain compatibility with the FIRST KitBot, with plenty of room to mount mechanisms and electronics.
              - |
                **KitBot chassis cutout** is reused, requiring two **5" sections** cut out of one end plate.

  - Intake:
      sections:
        - Overview:
            id: intake_overview
            displayedNodes: ["03_Intake_<1>"]
            facing: NW
            elevation: UPPER
            features:
              - |
                **Two NEO motors** provide power for reliable game object collection.
              - |
                **Compliant wheels** flex on contact, allowing easy intaking of game objects.

  - Hopper:
      sections:
        - Overview:
            id: hopper_overview
            displayedNodes: ["04_Hopper_<1>"]
            facing: SW
            elevation: UPPER
            features:
              - |
                **Polycarbonate panels** corral game objects and keep them contained.
              - |
                **Transparent hopper** provides visual feedback of how many game pieces remain.

  - Launcher:
      sections:
        - Overview:
            id: launcher_overview
            displayedNodes: ["05_Launcher_<1>"]
            facing: SW
            elevation: UPPER
            features:
              - |
                **2 CIM motors** enable rapid spin-up for consistent launches.
              - |
                **Fixed angle hood** is rigid and simple to construct, eliminating complexity.

  - Climber:
      sections:
        - Overview:
            id: climber_overview
            displayedNodes: ["06_Climber_<1>"]
            facing: SW
            elevation: UPPER
            features:
              - |
                **Chain driven** mechanism is simple, lightweight, and mechanically efficient.

  - Electronics:
      sections:
        - Overview:
            id: electronics_overview
            displayedNodes: ["07_Electronics_<1>"]
            facing: N
            elevation: UPPER
            features:
              - |
                **Kit of Parts wiring** — the electrical system can be assembled using wire and connectors included in the KoP, with electrical components from the Rookie KoP or retained from previous seasons.
              - |
                **One additional motor controller** (Spark MAX or equivalent) is required beyond the KoP to power all eight Everybot motors.
              - |
                **Flexible control system support** — compatible with any legal combination of REV and CTRE components. Rookie teams receive a full REV control system; this guide focuses on that configuration.
